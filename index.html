
<div id="player-wrap">
  <div id="player"></div>
  <div id="yt-controls-blocker"></div>
</div>
 
<div id="overlay">
  <div id="scrambleText"></div>
  <p id="overlayMsg">Now loading</p>
  <button id="playBtn">▶</button>
</div>
 
<div id="hud">
  <div id="clock">--:--:--</div>
  <button id="scheduleToggleBtn">Schedule ☰</button>
  <button id="ccToggleBtn">CC</button>
</div>
 
<div id="player-controls-content">
  <div id="countdown" class="hidden"></div>
  <button id="skipBtn" class="hidden">⏭ Skip</button>
</div>
 
<div id="schedulePanel">
  <div id="schedulePanelHeader">
    <h2>Schedule</h2>
    <button id="closePanelBtn">✕</button>
  </div>
  <div class="panel-cards" id="scheduleCards"></div>
</div>
